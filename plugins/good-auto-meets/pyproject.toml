[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "good-auto-meets"
version = "0.1.0"
description = "Local meeting capture and reading materials, operated by an agent"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "Jinja2>=3.1.6,<4", "psutil>=6,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
auto-meets = "auto_meets.cli:main"

[tool.setuptools.packages.find]
include = ["auto_meets*"]

[tool.setuptools.package-data]
auto_meets = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
